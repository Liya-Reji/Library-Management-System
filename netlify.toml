[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Redirect rules mapping standard /api endpoints to Netlify Serverless Functions
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/stats"
  to = "/.netlify/functions/stats"
  status = 200

[[redirects]]
  from = "/api/auth/register"
  to = "/.netlify/functions/auth-register"
  status = 200

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth/me"
  to = "/.netlify/functions/auth-me"
  status = 200

[[redirects]]
  from = "/api/books/:id"
  to = "/.netlify/functions/book-detail?id=:id"
  status = 200

[[redirects]]
  from = "/api/books"
  to = "/.netlify/functions/books"
  status = 200

[[redirects]]
  from = "/api/borrow/issue"
  to = "/.netlify/functions/borrow-issue"
  status = 200

[[redirects]]
  from = "/api/borrow/return"
  to = "/.netlify/functions/borrow-return"
  status = 200

[[redirects]]
  from = "/api/borrow/records"
  to = "/.netlify/functions/student-records?all=true"
  status = 200

[[redirects]]
  from = "/api/borrow/students"
  to = "/.netlify/functions/admin-students"
  status = 200

[[redirects]]
  from = "/api/borrow/my-records"
  to = "/.netlify/functions/student-records"
  status = 200

[[redirects]]
  from = "/api/admin/students"
  to = "/.netlify/functions/admin-students"
  status = 200

[[redirects]]
  from = "/api/student/records"
  to = "/.netlify/functions/student-records"
  status = 200

# Catch-all redirect for any other functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Global Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
