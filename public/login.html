<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Library Management System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-journal-bookmark-fill fs-3 me-2"></i>
        <span>Library Management System</span>
      </a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto" id="navbarLinks"></ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm p-4">
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-2" style="width: 56px; height: 56px;">
              <i class="bi bi-box-arrow-in-right fs-2"></i>
            </div>
            <h3 class="fw-bold mb-1">Account Login</h3>
            <p class="text-muted small">Sign in with your student or administrator credentials</p>
          </div>

          <!-- Alert message box -->
          <div id="loginAlert" class="alert d-none" role="alert"></div>

          <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();" novalidate>
            <div class="mb-3">
              <label for="usernameInput" class="form-label fw-semibold">Username or Email</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="usernameInput" required placeholder="Enter username or email" autocomplete="username">
              </div>
            </div>

            <div class="mb-4">
              <label for="passwordInput" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="passwordInput" required placeholder="Enter your password" autocomplete="current-password">
              </div>
            </div>

            <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2 fw-semibold">
              <span id="loginBtnText">Sign In</span>
              <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
          </form>

          <div class="mt-4 pt-3 border-top text-center text-muted small">
            Don't have a student account? <a href="register.html" class="fw-semibold text-primary">Register here</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-4 mt-auto">
    <div class="container text-center text-muted small">
      <p class="mb-0">Library Management System &mdash; Secure Authentication</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect to appropriate dashboard
      if (Auth.isLoggedIn()) {
        const user = Auth.getUser();
        if (user && user.role === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'student.html';
        }
      }

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('registered') === 'true') {
        showAlert('Registration successful! Please sign in with your credentials.', 'success');
      } else if (urlParams.get('expired') === 'true') {
        showAlert('Your session has expired. Please sign in again.', 'warning');
      }
    });

    function showAlert(message, type = 'danger') {
      const alertBox = document.getElementById('loginAlert');
      alertBox.className = `alert alert-${type}`;
      alertBox.textContent = message;
      alertBox.classList.remove('d-none');
    }

    async function handleLogin() {
      const alertBox = document.getElementById('loginAlert');
      alertBox.classList.add('d-none');

      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value;

      if (!username || !password) {
        showAlert('Please enter both username and password.');
        return;
      }

      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('loginBtnText');
      const spinner = document.getElementById('loginSpinner');

      btn.disabled = true;
      btnText.classList.add('d-none');
      spinner.classList.remove('d-none');

      try {
        const response = await API.post('/auth/login', { username, password });

        if (response.success && response.data) {
          API.setToken(response.data.token);
          Auth.setUser(response.data.user);

          if (response.data.user.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'student.html';
          }
        } else {
          showAlert(response.error || 'Login failed.');
        }
      } catch (err) {
        showAlert(err.message || 'Login failed. Please check your credentials.');
      } finally {
        btn.disabled = false;
        btnText.classList.remove('d-none');
        spinner.classList.add('d-none');
      }
    }
  </script>
</body>
</html>
