<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Catalogue - Library Management System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-journal-bookmark-fill fs-3 me-2"></i>
        <span>Library Management System</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center" id="navbarLinks">
          <!-- Injected dynamically by auth.js -->
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <!-- Header -->
    <div class="d-flex flex-wrap align-items-center justify-content-between mb-4 gap-2">
      <div>
        <h2 class="fw-bold mb-1"><i class="bi bi-book text-primary me-2"></i>Library Book Catalogue</h2>
        <p class="text-muted mb-0">Browse through available titles and copies in real time.</p>
      </div>
      <div id="adminActionContainer"></div>
    </div>

    <!-- Filter and Search Card -->
    <div class="card p-3 mb-4 shadow-sm">
      <div class="row g-3 align-items-center">
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
            <input type="text" id="searchInput" class="form-control" placeholder="Search by title, author, or ISBN...">
          </div>
        </div>
        <div class="col-md-4">
          <select id="categorySelect" class="form-select">
            <option value="All">All Categories</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Software Engineering">Software Engineering</option>
            <option value="Networking">Networking</option>
            <option value="Operating Systems">Operating Systems</option>
            <option value="Databases">Databases</option>
            <option value="Mathematics">Mathematics</option>
            <option value="General Literature">General Literature</option>
          </select>
        </div>
        <div class="col-md-2 d-grid">
          <button id="resetFiltersBtn" class="btn btn-outline-secondary" type="button">
            <i class="bi bi-arrow-counterclockwise"></i> Reset
          </button>
        </div>
      </div>
    </div>

    <!-- Books Count and Status Alert -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <span class="text-muted small" id="catalogueStatus">Loading books...</span>
    </div>

    <!-- Books Table View / Cards -->
    <div class="card shadow-sm overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover mb-0" id="booksTable">
          <thead>
            <tr>
              <th scope="col" style="width: 5%;">#</th>
              <th scope="col" style="width: 35%;">Title</th>
              <th scope="col" style="width: 25%;">Author</th>
              <th scope="col" style="width: 15%;">Category</th>
              <th scope="col" style="width: 10%;">ISBN</th>
              <th scope="col" class="text-center" style="width: 10%;">Availability</th>
            </tr>
          </thead>
          <tbody id="booksTableBody">
            <tr>
              <td colspan="6" class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <div class="text-muted mt-2">Loading catalogue...</div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-4 mt-auto">
    <div class="container text-center text-muted small">
      <p class="mb-0">Library Management System &mdash; Public Book Catalogue</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/books.js"></script>
</body>
</html>
